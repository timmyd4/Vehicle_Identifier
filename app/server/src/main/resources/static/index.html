<!doctype html>
<!--
  HOST PAGE: the HTML page that loads our compiled GWT app.

  The browser loads this page, the <script> tag below loads app.nocache.js (the
  small GWT loader), and the loader picks the right compiled version for this
  browser (one of the *.cache.js "permutations") and runs App.onModuleLoad().

  Where it lives: server/src/main/resources/static/. Spring Boot serves every file
  in static/ automatically, and index.html is served for "/" (the "welcome page").
  The app/ folder it points to is NOT in source control: the server's build unpacks
  it from the client module's output into target/classes/static/app/ (see server/pom.xml).
-->
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Car Identifier</title>

    <!-- Tells SmartGWT where its own files (scripts, theme images) live:
         the "sc" folder inside our module's output folder "app". -->
    <script>var isomorphicDir = "app/sc/";</script>

    <!-- Loads the compiled GWT app. "app" = moduleShortName / rename-to. -->
    <script src="app/app.nocache.js"></script>
</head>
<body>
    <!-- Shown only if JavaScript is disabled; otherwise SmartGWT draws the whole UI. -->
    <noscript>This app needs JavaScript enabled.</noscript>
</body>
</html>
