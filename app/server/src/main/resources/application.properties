# Spring Boot configuration. Spring reads this file automatically from the classpath
# (src/main/resources ends up in target/classes, then inside the jar).

# Only accept connections from this computer. Safer while developing: nothing on
# your network can reach the server. (Phone access later goes through Tailscale,
# which forwards to 127.0.0.1.)
server.address=127.0.0.1

# The port Jetty listens on. 8080 is Spring Boot's default; written out so it's obvious.
server.port=8080

# Folder holding car_model.onnx, detector.onnx, labels.json, preprocessing.json
# (written by training/export_onnx.py). The models are NOT inside the jar: they're
# ~190 MB and change on every retrain, so the server reads them from disk.
# Relative paths start from the folder you run `java -jar` in. We run from app/,
# so ../models is the project's models/ folder. Override without rebuilding:
#   java -jar server/target/car-identifier-server-0.1.0-SNAPSHOT.jar --carid.models-dir=C:/path/to/models
carid.models-dir=../models
