# Settings for the Python training scripts. Every script in training/ reads this file.
# Paths are relative to the project root (the folder above training/).

paths:
  dataset_dir: data/VMMRdb   # one folder per class, e.g. honda_civic_2005/
  splits_dir: data/splits    # train/val/test CSVs written by build_subset.py
  runs_dir: training/runs    # generated output: reports, logs, charts
  checkpoints_dir: training/checkpoints   # saved model weights (best.pt, last.pt)
  models_dir: models         # exported files the Java app loads (export_onnx.py writes them)
  commons_dir: data/commons  # Wikimedia Commons photos + their manifest (commons_list.py, commons_download.py)

# commons_*.py: extra training photos from Wikimedia Commons (freely licensed).
commons:
  # Licenses we accept, by the start of Commons' license code: "cc-by-sa-4.0" starts with
  # "cc-by-sa". All of these allow reuse; CC BY / CC BY-SA require crediting the author,
  # which is why commons_list.py stores the author and license of every file.
  allowed_licenses: [cc0, pd, cc-by-sa, cc-by]
  min_width: 640             # skip files smaller than this (icons, tiny scans)
  thumb_width: 800           # download this width, not the original (often 4000+ px, 5-10 MB)
  # Download at most this many per category, so the Civic doesn't crowd out rare cars.
  # 200 = ~120k files (~12 h). 400 would add ~50k, nearly all for popular cars VMMRdb already covers well.
  max_per_category: 200
  # commons_filter.py: which downloaded photos are worth training on (see its docstring).
  filter:
    min_score: 0.7           # the main vehicle must be clearly a vehicle (stricter than the app's 0.5).
                             # 0.8 dropped good show-floor photos; junk that slips through gets caught in review
    min_area: 0.10           # ...and fill at least 10% of the photo (not a car far down the street)
    max_second_car: 0.8      # drop if another vehicle is nearly as big: which one is the label?
                             # (0.5 dropped good photos with a car parked behind; the pre-sort catches wrong-car picks)
  # commons_presort.py: when the clues agree enough to label a photo without a human.
  presort:
    # The model that sorts, AND the class list it was trained with. They must match: the
    # model's output #i means row #i of THAT classes.csv.
    # Run 4 now (the best so far; knows the facelift-gap looks). Earlier: run3_commons, run2_generations.
    checkpoint: training/checkpoints/run4_facelift/best.pt
    splits_dir: data/splits_run4_facelift
    min_other_car: 0.5       # the sorter gives another car at least this much -> "different car?" review
    auto_share: 0.8          # a look with this much of the candidates' probability wins on its own
  # commons_looks.py: which MISSING looks (fewer than 50 photos) a human gets asked about.
  looks:
    always: [toyota/highlander/XU50/facelift]   # make/model/generation/phase, asked no matter how far off
    max_need: 5              # ...plus looks at most this many photos short of 50 (raise it for more classes, more clicks)

# build_subset.py: which images and classes to train on, and how to split them.
subset:
  min_year: 1950             # drop folders outside this range (e.g. "1900" placeholders)
  max_year: 2016
  # What the answer on each card is:
  #   generations  = one class per look in training/generations.csv (make + model + generation
  #                  + facelift phase), e.g. Highlander XU50 facelift = toyota_highlander_2017-2019.
  #                  Models missing from that table, and years no row covers, are left out.
  #   year_buckets = the old run-1 labels: fixed groups of years (see year_bucket_size)
  label_mode: generations
  year_bucket_size: 3        # year_buckets mode only: 1 = each year is its own class, 3 = 2001-2003 etc., 0 = merge all years
  min_images_per_class: 50   # drop classes with fewer images than this (after cleaning)
  min_image_side: 100        # drop images whose width or height is below this many pixels
  split:                     # fractions of each class that go to each split (must sum to 1)
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42                   # fixed random seed so the split is the same every run
  # Run 3+: also train on the Commons photos commons_presort.py labeled "auto".
  include_commons: true
  # FROZEN TEST SET: keep every VMMRdb photo in the pile it had in this earlier split, so
  # this run and that one take exactly the same exam. "" = split VMMRdb fresh (runs 1-2).
  keep_split_from: data/splits_run2_generations

# train.py / evaluate.py / predict.py: the model and how images are fed to it.
training:
  # Pretrained model from timm (downloaded from Hugging Face's official timm/ org on first use).
  # ConvNeXt-Tiny, pretrained on ImageNet-22k (~14M photos) then fine-tuned on ImageNet-1k.
  model_name: convnext_tiny.fb_in22k_ft_in1k
  image_size: 224            # images are resized to image_size x image_size pixels before the model sees them
  num_workers: 8             # CPU processes that load + augment images in parallel while the GPU trains

  # How long and how hard to train. See the comments in train.py for what each one means.
  epochs: 20                 # full passes over the training images
  batch_size: 128            # images per training step (fits easily in the 4090's 24 GB)
  learning_rate: 0.0003      # peak step size for the optimizer (small, because we're fine-tuning)
  weight_decay: 0.05         # gently pulls weights toward zero, discouraging memorization
  warmup_epochs: 1           # ramp the learning rate up from ~0 over the first epoch
  label_smoothing: 0.1       # don't demand 100% confidence - helps with VMMRdb's noisy labels
  drop_path_rate: 0.1        # randomly skip blocks while training (up to 10%) - discourages memorizing; 0 = off (run 1)
  seed: 42                   # makes the random parts (weight init of the new layer, shuffling) repeatable

# detect.py: find the car in a photo and crop to it before identifying it.
# Uses a pretrained object detector from torchvision (trained on the COCO dataset). No training needed.
detector:
  model: fasterrcnn_mobilenet_v3_large_fpn   # fast + accurate enough to find the main car
  labels: [car, truck]       # COCO calls many SUVs and pickups "truck", so accept both
  min_score: 0.5             # ignore detections the detector is less than 50% sure about
  crop_margin: 0.1           # widen the box by 10% on each side, so the crop keeps a little background
                             # (training photos weren't cropped tight either)
